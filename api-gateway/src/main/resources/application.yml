spring:
    application:
        name: api-gateway
    cloud:
      gateway:
        server:
          webmvc:
            routes:
              - id: order-service
                uri: lb://order-service
                predicates:
                  - Path=/api/orders/**
              - id: inventory-service
                uri: lb://inventory-service
                predicates:
                  - Path=/api/inventory/**

server:
    port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
